{
"name": "Build S_Love_A VPN APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {
"build-apk": {
"runs-on": "ubuntu-latest",
"steps": [
{"name": "Checkout", "uses": "actions/checkout@v4"},
{"name": "Setup Java", "uses": "actions/setup-java@v4", "with": {"java-version": "17", "distribution": "temurin"}},
{"name": "Compile Full-Tunnel S_Love_A APK", "run": "echo '' | base64 -d > project.zip && unzip -o project.zip && python3 ci_build.py"},
{"name": "Upload APK Artifact", "uses": "actions/upload-artifact@v4", "with": {"name": "S_Love_A_VPN_APK", "path": "S_Love_A_VPN.apk"}},
{"name": "Publish APK Release", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v3.0.${{ github.run_number }}", "name": "Family VPN Cyber-Shield v3.0.${{ github.run_number }}", "files": "S_Love_A_VPN.apk"}}
]
}
}
}
