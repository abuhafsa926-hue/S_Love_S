{
"name": "Build S_Love_A VPN APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {
"build-apk": {
"runs-on": "ubuntu-latest",
"steps": [
{"name": "Checkout", "uses": "actions/checkout@v4"},
{"name": "Setup Java", "uses": "actions/setup-java@v4", "with": {"java-version": "17", "distribution": "temurin"}},
{"name": "Compile S_Love_A APK", "run": "echo '' | base64 -d > project.zip && unzip -o project.zip && mkdir -p gen obj && BT=$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1) && PL=$ANDROID_HOME/platforms/$(ls -1 $ANDROID_HOME/platforms | sort -V | tail -n 1) && $BT/aapt2 compile --dir app/src/main/res -o res.zip && $BT/aapt2 link -o unaligned.apk -I $PL/android.jar --manifest app/src/main/AndroidManifest.xml --java gen res.zip && javac -encoding UTF-8 -source 1.8 -target 1.8 -cp $PL/android.jar -d obj gen/com/slovea/vpn/R.java app/src/main/java/com/slovea/vpn/SLoveAVpnService.java app/src/main/java/com/slovea/vpn/MainActivity.java && jar cf classes.jar -C obj . && $BT/d8 --lib $PL/android.jar --output . classes.jar && zip -u unaligned.apk classes.dex && $BT/zipalign -f -p 4 unaligned.apk aligned.apk && keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SLoveA,O=Android,C=US' && $BT/apksigner sign --v1-signing-enabled true --v2-signing-enabled true --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out S_Love_A_VPN.apk aligned.apk"},
{"name": "Upload APK Artifact", "uses": "actions/upload-artifact@v4", "with": {"name": "S_Love_A_VPN_APK", "path": "S_Love_A_VPN.apk"}},
{"name": "Publish APK Release", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v1.0.${{ github.run_number }}", "name": "S_Love_A VPN App v1.0.${{ github.run_number }}", "files": "S_Love_A_VPN.apk"}}
]
}
}
}
